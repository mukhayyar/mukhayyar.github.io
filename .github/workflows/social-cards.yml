# Regenerates the share cards and the per-post share pages whenever posts change,
# so a new post shows its own card on WhatsApp, LinkedIn, X, Telegram, Facebook, Discord, Slack …
name: Social cards

on:
  push:
    branches: [main]
    paths:
      - 'blog/*.md'
      - 'blog/posts.json'
      - 'tools/og/**'
      - 'assets/js/halftone.js'
      - 'assets/js/scenes/planet.js'
      - 'assets/js/scenes/projects.js'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: social-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install generator
        run: npm install --prefix tools/og --no-audit --no-fund
      - name: Install Chromium
        run: npx --prefix tools/og playwright install --with-deps chromium
      - name: Build cards and post pages
        run: node tools/og/build.mjs
      - name: Commit generated files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A og-image.png me/og.png sitemap.xml blog
          if git diff --cached --quiet; then echo "Nothing to update"; exit 0; fi
          git commit -m "Update social cards and post pages"
          git push
          # Pushes made with GITHUB_TOKEN do not start a Pages build on their own.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
