<!doctype html>
<!-- Share card for a blog post, 1200×630. Rendered by tools/og/build.mjs:
     post.html?title=…&date=…&tags=…&slug=… -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #F1F0EB; color: #0E0E0C; font-family: Geist, sans-serif; position: relative;
    --ht-ink: #0E0E0C; --ht-accent: #FF4A1C; --ht-muted: #9B9A93; --ht-faint: #C9C7BF; }
  .l { position: absolute; left: 64px; top: 58px; bottom: 56px; width: 640px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 550; font-size: 22px; letter-spacing: -.02em; }
  .brand svg { width: 26px; height: 26px; }
  .brand circle { fill: #0E0E0C; } .brand .a { fill: #FF4A1C; }
  .k { margin-top: 56px; font: 450 15px/1.4 "Geist Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: #55554F; display: flex; gap: 14px; align-items: center; }
  .k b { width: 8px; height: 8px; border-radius: 50%; background: #FF4A1C; display: inline-block; }
  h1 { margin: 22px 0 0; font-weight: 500; line-height: .98; letter-spacing: -.05em; text-wrap: balance; }
  .f { margin-top: auto; font: 450 15px/1.4 "Geist Mono", monospace; letter-spacing: .07em; text-transform: uppercase; color: #6B6A64; display: flex; justify-content: space-between; gap: 20px; }
  .art { position: absolute; right: 56px; top: 56px; width: 420px; height: 518px; background: #F7F6F2; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(14,14,12,.12); overflow: hidden; }
  .art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="l">
  <div class="brand"><svg viewBox="0 0 22 22"><circle cx="2.2" cy="2.2" r="1.95"/><circle cx="6.6" cy="2.2" r="1.95"/><circle class="a" cx="11" cy="2.2" r="1.95"/><circle cx="15.4" cy="2.2" r="1.95"/><circle cx="19.8" cy="2.2" r="1.95"/><circle cx="2.2" cy="6.6" r="1.68"/><circle cx="6.6" cy="6.6" r="0.97"/><circle cx="11" cy="6.6" r="1.95"/><circle cx="15.4" cy="6.6" r="0.97"/><circle cx="19.8" cy="6.6" r="1.68"/><circle cx="2.2" cy="11" r="1.68"/><circle cx="11" cy="11" r="1.95"/><circle cx="19.8" cy="11" r="1.68"/><circle cx="2.2" cy="15.4" r="1.68"/><circle cx="11" cy="15.4" r="1.95"/><circle cx="19.8" cy="15.4" r="1.68"/><circle cx="2.2" cy="19.8" r="1.68"/><circle cx="11" cy="19.8" r="1.95"/><circle cx="19.8" cy="19.8" r="1.68"/></svg>Tsaqif Mukhayyar</div>
  <div class="k"><b></b><span>Writing</span><span id="date"></span></div>
  <h1 id="title"></h1>
  <div class="f"><span id="tags"></span><span id="url"></span></div>
</div>
<div class="art"><canvas id="cv"></canvas></div>
<script src="../../assets/js/halftone.js"></script>
<script src="../../assets/js/scenes/projects.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const title = q.get('title') || '', tags = (q.get('tags') || '').split(',').filter(Boolean);
  document.getElementById('title').textContent = title;
  document.getElementById('date').textContent = q.get('date') || '';
  document.getElementById('tags').textContent = tags.join(' · ');
  document.getElementById('url').textContent = 'mukhayyar.my.id';
  Promise.all([document.fonts.load('500 80px Geist'), document.fonts.load('450 15px "Geist Mono"')]).then(() => document.fonts.ready).then(() => {
    // Largest size that keeps the title within three lines (and inside the column).
    const h = document.getElementById('title');
    for (let s = 96; s >= 40; s -= 2) {
      h.style.fontSize = s + 'px';
      if (h.getBoundingClientRect().height <= s * 0.98 * 3 + 2 && h.scrollWidth <= 640) break;
    }
    let sc = Halftone.scenes.projectArt(title, tags.join(' '));
    const ht = new Halftone(document.getElementById('cv'), sc, { autoplay: false });
    ht.onready = () => { ht.renderAt(1.4); window.__ready = true; };
  });
</script>
</body>
</html>
