<!doctype html>
<!-- Social card source, 1200x630: /og-image.png (home) and, with ?v=me, /me/og.png. Rendered by tools/og/build.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #F1F0EB; color: #0E0E0C; font-family: Geist, sans-serif;
    --ht-ink: #0E0E0C; --ht-accent: #FF4A1C; --ht-muted: #9B9A93; --ht-faint: #C9C7BF; position: relative; }
  canvas { position: absolute; right: -40px; top: -10px; width: 700px; height: 650px; }
  .t { position: absolute; left: 64px; top: 58px; bottom: 56px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 550; font-size: 22px; letter-spacing: -.02em; }
  .brand svg { width: 24px; height: 24px; }
  h1 { margin: 0; font-weight: 500; font-size: 104px; line-height: .88; letter-spacing: -.058em; color: #fff; mix-blend-mode: difference; }
  h1 em { font-family: "Instrument Serif", serif; font-weight: 400; letter-spacing: -.03em; }
  .m { font: 450 15px/1.4 "Geist Mono", monospace; letter-spacing: .07em; text-transform: uppercase; color: #55554F; display: flex; gap: 28px; }
  .m b { color: #FF4A1C; font-weight: 500; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="t">
  <div class="brand"><svg viewBox="0 0 22 22"><circle cx="2.20" cy="2.20" r="1.95"/><circle cx="6.60" cy="2.20" r="1.95"/><circle class="a" fill="#FF4A1C" cx="11.00" cy="2.20" r="1.95"/><circle cx="15.40" cy="2.20" r="1.95"/><circle cx="19.80" cy="2.20" r="1.95"/><circle cx="2.20" cy="6.60" r="1.68"/><circle class="s" cx="6.60" cy="6.60" r="0.97"/><circle cx="11.00" cy="6.60" r="1.95"/><circle class="s" cx="15.40" cy="6.60" r="0.97"/><circle cx="19.80" cy="6.60" r="1.68"/><circle cx="2.20" cy="11.00" r="1.68"/><circle cx="11.00" cy="11.00" r="1.95"/><circle cx="19.80" cy="11.00" r="1.68"/><circle cx="2.20" cy="15.40" r="1.68"/><circle cx="11.00" cy="15.40" r="1.95"/><circle cx="19.80" cy="15.40" r="1.68"/><circle cx="2.20" cy="19.80" r="1.68"/><circle cx="11.00" cy="19.80" r="1.95"/><circle cx="19.80" cy="19.80" r="1.68"/></svg>Tsaqif Mukhayyar</div>
  <h1 id="h">Ideas into<br>shipped <em>software.</em></h1>
  <div class="m" id="m"><span><b>●</b> Product engineer</span><span>Web, mobile &amp; AI</span><span>mukhayyar.my.id</span></div>
</div>
<script src="../../assets/js/halftone.js"></script>
<script src="../../assets/js/scenes/planet.js"></script>
<script>
  // og.html → /og-image.png (home); og.html?v=me → /me/og.png (the long page)
  if (new URLSearchParams(location.search).get('v') !== 'me') document.getElementById('h').style.fontSize = '92px';
  if (new URLSearchParams(location.search).get('v') === 'me') {
    document.getElementById('h').innerHTML = 'Firmware to cloud,<br>ground to <em>sky.</em>';
    document.getElementById('m').innerHTML = '<span><b>●</b> Software engineer</span><span>Surabaya, ID</span><span>mukhayyar.my.id/me</span>';
  }
  const ht = new Halftone(document.getElementById('cv'), Halftone.scenes.planet, { autoplay: false });
  ht.onready = () => { ht.renderAt(4.2); document.fonts.ready.then(() => { window.__ready = true; }); };
</script>
</body>
</html>
